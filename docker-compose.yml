networks:
  frontend:
  backend:  
volumes:
  web-vol:
  db-vol:  
services:
  web:
    image: nginx
    ports:
     - 8080:80  
    depends_on:
     - db   
    volumes:
     - /data:/var/www/html
     - web-vol:/usr/share/nginx/html  
    networks:
     - frontend
     - backend   
  db:
    image: mysql:5.6
    environment:
       MYSQL_ROOT_PASSWORD: pass    
    volumes:
     - db-vol:/var/lib/mysql
    networks:
     - backend   
          
