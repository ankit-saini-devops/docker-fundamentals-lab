# Define the custom networks for service isolation
networks:
  frontend:
  backend:

# Define permanent storage for the application data
volumes:
  web-vol:
  db-vol:

services:
  # Web server service using Nginx
  web:
    image: nginx
    ports:
      - 8080:80 # Maps host port 8080 to container port 80
    depends_on:
      - db # Ensures the database container starts before this one
    volumes:
      - /data:/var/www/html             # Bind mount: maps local /data to container
      - web-vol:/usr/share/nginx/html   # Named volume for web content
    networks:
      - frontend # Accessible by external users
      - backend  # Used to communicate with the database

  # Database service using MySQL 5.6
  db:
    image: mysql:5.6
    environment:
      MYSQL_ROOT_PASSWORD: pass # Sets the root password for the DB
    volumes:
      - db-vol:/var/lib/mysql # Persistent storage for database records
    networks:
      - backend # Isolated; can only be reached by the web service

